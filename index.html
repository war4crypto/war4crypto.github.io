<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CoinGecko API Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    input, button { padding: 8px; margin-top: 10px; }
  </style>
</head>
<body>

<h2>🚀 CoinGecko Live Market Viewer</h2>
<button onclick="fetchCrypto()">Get Top 5 Cryptos</button>

<table id="resultsTable">
  <thead>
    <tr><th>Name</th><th>Symbol</th><th>Price (USD)</th><th>Market Cap</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  async function fetchCrypto() {
    const url = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=5&page=1";
    const res = await fetch(url);
    const data = await res.json();

    const tbody = document.querySelector("#resultsTable tbody");
    tbody.innerHTML = "";

    data.forEach(coin => {
      const row = `<tr>
        <td>${coin.name}</td>
        <td>${coin.symbol.toUpperCase()}</td>
        <td>$${coin.current_price.toFixed(2)}</td>
        <td>$${coin.market_cap.toLocaleString()}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }
</script>

</body>
</html>
